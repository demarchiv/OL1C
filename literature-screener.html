<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OL1C · Literature Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&family=Bitter:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Inter:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: scholarly, calm — the OL1C mock-up, built as specified
   IDEA: the OL-in-One Compass as a reading instrument for the literature
   PICTURE: the compass outline itself, with one dot per case × evidence type
   COLOUR and TYPE: white, navy #182b68, compass cyans; Bitter for reading, Inter for UI
   LAYOUT: compass left, reading column right; stacks below 900px */
:root{color-scheme:light;--navy:#182b68;--lab:#2a4b4d;--muted:#8d8d8d;--rule:#c6c6c6;
  --INTENDED:#431b93;--IMPLIED:#848008;--OBSERVED:#2f5e11;--REPORTED:#8b138e;
  --fP:#c6f7e6;--fPe:#b1f1fc;--fD:#56caed}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#fff;color:var(--navy);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,72px);max-width:1640px;margin:0 auto;padding:clamp(20px,3.5vw,56px) clamp(16px,4vw,64px)}
/* left: compass */
.left{position:relative;display:flex;flex-direction:column;align-items:center}
.toggles{align-self:flex-start;display:grid;gap:4px;margin:0 0 -40px 2%;position:relative;z-index:2}
.tg{display:flex;align-items:center;gap:10px;background:none;border:0;padding:3px 0;font:400 19px/1.2 Inter,sans-serif;color:var(--navy);cursor:pointer;min-height:30px}
.tg[aria-pressed=false]{color:#6f6f6f}
.sw{width:32px;height:16px;border-radius:9px;border:1.5px solid var(--navy);position:relative;flex:none;background:#e7ecff}
.sw::after{content:"";position:absolute;top:2px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--navy);transition:right .15s}
.tg[aria-pressed=false] .sw{border-color:#6f6f6f;background:#fff}
.tg[aria-pressed=false] .sw::after{right:17px;background:#6f6f6f}
.tg:focus-visible,.case:focus-visible,.tab:focus-visible,.info:focus-visible,.small:focus-visible{outline:2px solid var(--fD);outline-offset:3px;border-radius:6px}
#compass{width:100%;max-width:820px;height:auto;display:block;overflow:visible}
.wv{fill:none;stroke-width:1.1}
.w-D{stroke:var(--fD)}.w-Pe{stroke:#8fe3f5}.w-P{stroke:#9fe9cf}
.lbl{pointer-events:none;fill:var(--lab);opacity:.62;font:500 13.77px Manrope,sans-serif;transition:opacity .2s}
.lbl.on{opacity:1;font-weight:800}
.dot{cursor:pointer;transition:opacity .2s}
.dot:hover{opacity:1!important}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;width:min(100%,640px);margin-top:4px}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.gh{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.gh::before,.gh::after{content:"";flex:1;height:1px;background:var(--rule)}
.pill{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;color:#fff;font-size:13.5px;letter-spacing:.04em;height:32px;padding:0 34px 0 18px}
.info{position:absolute;right:6px;top:4px;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:none;color:rgba(255,255,255,.75);font:italic 600 13px/1 Bitter,serif;cursor:pointer;padding:0}
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:250px;background:#fff;color:var(--navy);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;letter-spacing:0;box-shadow:0 8px 24px rgba(24,43,104,.14);z-index:5}
.tip b{display:block;font-weight:600;margin-bottom:2px}
/* right: reading column */
.right{padding-top:clamp(0px,3vw,56px)}
h1{font:500 clamp(30px,3.1vw,48px)/1.08 Bitter,serif;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1 b{font-weight:800}h1 i{font-style:normal;font-weight:700}
.small h1{font-size:clamp(20px,1.6vw,25px);line-height:1.15}
.small{display:block;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.list{list-style:none;margin:clamp(32px,6vw,92px) 0 0;padding:0;display:grid;gap:6px}
.case{display:flex;align-items:center;gap:16px;background:none;border:0;padding:4px 0;font:400 clamp(21px,1.75vw,28px)/1.35 Bitter,serif;color:var(--navy);cursor:pointer;text-align:left}
.case:hover .ct{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.case .chev{width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px);flex:none}
.case.off{color:#c7cbdc}
.view h2{font:800 clamp(32px,3.2vw,50px)/1.05 Bitter,serif;margin:clamp(28px,4vw,56px) 0 12px;text-wrap:balance}
.desc{font:400 17px/1.5 Bitter,serif;color:#5f5f5f;margin:0 0 10px;max-width:62ch}
.papers{margin:0 0 26px 22px;padding:0;list-style:none;font-size:14.5px;color:#9a9a9a;display:grid;gap:4px}
.papers a{color:#8a8a8a;text-decoration:none;border-bottom:1px solid #d3d3d3}
.papers a:hover{color:var(--navy);border-color:var(--navy)}
.box{display:grid;grid-template-columns:1fr 18px;gap:4px;border-radius:14px;overflow:hidden;min-height:230px}
.bin{padding:22px 26px 26px;background:var(--tint)}
.bar{background:var(--fam)}
.bt{font:500 clamp(19px,1.5vw,24px)/1.25 Inter,sans-serif;color:var(--lc);margin:0 0 8px}
.bt em{font-style:italic}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{border:0;padding:2px 9px;font:600 13.5px/1.3 Inter,sans-serif;letter-spacing:.05em;color:rgba(255,255,255,.8);background:var(--lc);opacity:.55;cursor:pointer}
.tab[aria-selected=true]{opacity:1;color:#fff}
.syn{font:400 17px/1.55 Bitter,serif;color:#383838;margin:0;max-width:64ch}
.tbw{color:#7d7d7d;font-style:italic}
.exl{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.exl q{font:400 16.5px/1.5 Bitter,serif;color:#383838;quotes:"“" "”"}
.exl small{display:block;margin-top:3px;font-size:12.5px;letter-spacing:.02em;color:#6b6b6b}
.others{border-top:1px solid #6f6f6f;margin-top:clamp(28px,3.5vw,52px);padding-top:18px;display:grid;grid-template-columns:repeat(2,max-content);gap:0 clamp(32px,5vw,80px)}
.others ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;align-content:start}
.others .case{font-size:clamp(18px,1.35vw,21px);gap:10px}
.others .case::before{content:"↘";font:700 14px Inter,sans-serif}
@media (max-width:900px){.app{grid-template-columns:1fr}.toggles{margin-bottom:0}.right{padding-top:0}.others{grid-template-columns:1fr}}
@media (max-width:600px){.legend{grid-template-columns:1fr}.pill{font-size:12.5px;padding-right:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

    </div>

const D={"cases": [{"name": "Agar Piano", "type": "HCI", "desc": "Tangible musical interface whose keys are cast from SeaFoam, a biomaterial of agar extracted from red seaweed and oyster-shell powder. Built with a Makey Makey-style board and Scratch: pressing the conductive keys triggers ocean sounds and animates corresponding fish on screen. Demonstrated to schoolchildren after touching real seaweeds and oysters; not formally evaluated.", "papers": [{"title": "Cast Ashore: Sensory Interactions with Sea-derived Matter", "doi": "https://doi.org/10.1145/3715668.3735597"}, {"title": "Making SeaFoam: An Autobiographical Design Journey Engaging Local Ecologies Through Making", "doi": "https://doi.org/10.1145/3715336.3735413"}], "codes": {"P6": ["INTENDED"], "Pe7": ["INTENDED"], "D1": ["INTENDED"], "D4": ["INTENDED"], "D5": ["INTENDED"], "D7": ["INTENDED", "OBSERVED"]}, "ex": {"P6": [{"lab": "INTENDED", "sec": "DIS25 Companion Introduction", "q": "The Agar Piano and Sea Tile celebrate the agency of nonhuman sea-derived matter and its entanglement with human activity."}, {"lab": "INTENDED", "sec": "DIS25 Pictorial, Applying: SeaFoam in Interactive Systems", "q": "The next step in FA´s design process was to apply SeaFoam in artefacts that enable interaction with digital data; her research aims to evoke the origins of these once-living materials and the ecologies they stem from through digital storytelling."}], "Pe7": [{"lab": "INTENDED", "sec": "DIS25 Companion §2.1 Agar piano", "q": "The concept emerged from the authors’ interest in designing sustainable children’s toys using biodegradable materials."}, {"lab": "INTENDED", "sec": "DIS25 Pictorial, Applying: SeaFoam in Interactive Systems", "q": "We brainstormed ideas for future projects that could combine electronics and sustainable materials that can be used disassembled to be discarded safely or re-molten."}], "D1": [{"lab": "INTENDED", "sec": "DIS25 Companion §2.1 Agar piano", "q": "Built using a ‘Makey Makey’ style microcontroller-based interface [8] and the open-source platform Scratch [11], the Agar Piano introduces ocean literacy through embodied interaction."}, {"lab": "INTENDED", "sec": "DIS25 Pictorial, Applying: SeaFoam in Interactive Systems", "q": "Built using Makey Makey [34] hardware and Scratch [63], an open-source coding tool, the device integrates ocean literacy learning into an interactive exploration."}, {"lab": "INTENDED", "sec": "DIS25 Pictorial, Applying: SeaFoam in Interactive Systems", "q": "I took the ‘Agar Piano’ to my sons’ school and gave two classes a demonstration, which started with learning about seaweeds and oysters then letting the children touch and smell them before interacting with the piano."}], "D4": [{"lab": "INTENDED", "sec": "DIS25 Companion Abstract", "q": "These artefacts celebrate the vitality and agency of once-living sea-derived matter, prompting curiosity about where these materials come from, how they transform, and what kinds of stories they might tell."}], "D5": [{"lab": "INTENDED", "sec": "DIS25 Companion Introduction", "q": "These materials offer an example of locally sourced alternatives for interaction design and invite reflection on the ecological origins and afterlives of the materials we use."}], "D7": [{"lab": "INTENDED", "sec": "DIS25 Pictorial, Introduction", "q": "[...] speculate on how applying SeaFoam in interactive systems design could elicit interest and emotional response to sea-derived matter ecologies in others."}, {"lab": "OBSERVED", "sec": "DIS25 Companion §2.1 Agar piano", "q": "When interacting with the piano, the calming notes and animated visuals created a moment of quiet engagement, soon followed by joyful excitement as each child took a turn."}, {"lab": "OBSERVED", "sec": "DIS25 Pictorial, Applying: SeaFoam in Interactive Systems (FA’s Diary)", "q": "The calming notes from pressing the fish keys created a brief contemplative moment, which was then interrupted by the children’s excitement."}]}, "syn": {"P6": "<to be written>", "Pe7": "<to be written>", "D1": "<to be written>", "D4": "<to be written>", "D5": "<to be written>", "D7": "<to be written>"}}, {"name": "Bio Fabulations", "type": "HCI", "desc": "Methodological assemblage (toolkit-in-the-making and framework) for children's planetary care. In three stages, Observe, Create and Fabulate, Animate and Tell, eighteen fourth-graders sketched beach life, materialised magical creatures with sea-derived materials and turned their stories into one-minute stop-motion animations presented to school and caregivers. Twelve-week classroom case study.", "papers": [{"title": "BioFabulations: Embodied SenseMaking for Planetary Care", "doi": "https://doi.org/10.1145/3803784.3809288"}], "codes": {"P5": ["OBSERVED", "REPORTED"], "P6": ["INTENDED", "OBSERVED", "REPORTED"], "Pe5": ["INTENDED"], "Pe7": ["INTENDED"], "D1": ["INTENDED", "OBSERVED", "REPORTED"], "D2": ["INTENDED", "OBSERVED"], "D4": ["INTENDED", "OBSERVED"], "D5": ["INTENDED"], "D7": ["INTENDED", "OBSERVED", "REPORTED"], "D8": ["INTENDED", "OBSERVED"]}, "ex": {"P5": [{"lab": "OBSERVED", "sec": "Session 2 – Beach Trip, Field diary task 1", "q": "The children mapped 43 elements in total, including living things, non-living things and AMDs"}, {"lab": "REPORTED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "Comments included observations such as: ‘wonder’, ‘learnings about marine life’ and ‘things that can be made from the ocean’"}, {"lab": "REPORTED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "‘I learnt what skate eggs looked like’"}], "P6": [{"lab": "INTENDED", "sec": "Project’s Learning Goals", "q": "Recognise human impact in shared ecologies"}, {"lab": "INTENDED", "sec": "Field diary task 2: Cyanotype prints", "q": "Our aim was to support children in observing the entanglement of natural and human-made matter, reflecting on the presence and impact of AMD and questioning how it arrives."}, {"lab": "INTENDED", "sec": "Session 4 – Bioclay creatures", "q": "Building on earlier sessions (see page 5), FA connected these materials to local marine practices and natureculture entanglements [20] such as oyster farming [32] and seaweed harvesting [35]."}, {"lab": "OBSERVED", "sec": "Session 2 – Beach Trip, Field diary task 1", "q": "The children mapped 43 elements in total, including living things, non-living things and AMDs"}, {"lab": "REPORTED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "Comments included observations such as: ‘wonder’, ‘learnings about marine life’ and ‘things that can be made from the ocean’"}], "Pe5": [{"lab": "INTENDED", "sec": "Introduction", "q": "BioFabulations contributes to stimulating forms of relationality through which children can come to know, value and care for the MtH world [43]."}, {"lab": "INTENDED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "This gesture reframed the artefact not as a lasting keepsake, but as an object designed to decay, positioning making as a temporary act of care rather than ownership."}], "Pe7": [{"lab": "INTENDED", "sec": "A School Near the Coast", "q": "Aligning with UN SDG 14 (Life Below Water) [54], we engaged ocean literacy to nurture curiosity and care for marine ecologies [10,24] through situated observation."}, {"lab": "INTENDED", "sec": "Project’s Learning Goals", "q": "Related SDG14 targets (Case Study) [54] • 14.1 Reduce marine pollution • 14.2 Protect and restore ecosystems"}, {"lab": "INTENDED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "In doing so, we opened space to discuss ecological reciprocity, non-polluting materials and letting go as a pedagogical practice."}], "D1": [{"lab": "INTENDED", "sec": "Abstract", "q": "[...] shows how intersecting HCI, materials-making and storytelling supports children in internalising ecological concepts through creative learning."}, {"lab": "INTENDED", "sec": "Project’s Learning Goals", "q": "Raise awareness of material temporalities (durability vs.biodegradability)"}, {"lab": "OBSERVED", "sec": "Reflections", "q": "We witnessed strong participation, concept retention and increased understanding of coastal ecologies, materials and creative processes through their work."}, {"lab": "REPORTED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "Comments included observations such as: ‘wonder’, ‘learnings about marine life’ and ‘things that can be made from the ocean’"}, {"lab": "REPORTED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "‘I learnt what skate eggs looked like’"}], "D2": [{"lab": "INTENDED", "sec": "Project’s Learning Goals", "q": "Develop creative storytelling skills"}, {"lab": "INTENDED", "sec": "Methodology", "q": "In Animate and Tell, the children created one-minute stop-motion animations of their stories and presented them to the school and caregivers."}, {"lab": "OBSERVED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "The school coordinator added that children were retelling the project at home, letting learning ‘trickle down’ to parents and back into classroom dialogue."}], "D4": [{"lab": "INTENDED", "sec": "Project’s Learning Goals", "q": "Elicit care for MtH beings"}, {"lab": "INTENDED", "sec": "Abstract", "q": "Shifting from abstract knowledge to embodied, relational engagement, this work illustrates how direct encounters with local ecologies cultivate awareness, curiosity and care"}, {"lab": "OBSERVED", "sec": "The Animations", "q": "Across the six group stories, themes of friendship and rescue were prevalent."}, {"lab": "OBSERVED", "sec": "The Animations", "q": "‘The Three Friends’ is a story of rescue, friendship and the power of caring."}], "D5": [{"lab": "INTENDED", "sec": "Framework", "q": "It is designed to invite awareness of planetary care (in this case study, focused on the oceans), while engaging MtH temporalities, from serendipitous encounters with biomatter to intentional world-making through storytelling and material practices."}, {"lab": "INTENDED", "sec": "Project’s Learning Goals", "q": "Raise awareness of material temporalities (durability vs.biodegradability)"}], "D7": [{"lab": "INTENDED", "sec": "Introduction", "q": "Far from instilling eco-anxiety [26], we engage children through playful making and storytelling as a form of expression and pedagogical tools."}, {"lab": "OBSERVED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "FA answered parents’ questions, many about the bioclay; one parent shared how engaged their child had been."}, {"lab": "REPORTED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "Comments included observations such as: ‘wonder’, ‘learnings about marine life’ and ‘things that can be made from the ocean’; they expressed excitement about some of the ‘creative tools’ we used."}, {"lab": "REPORTED", "sec": "Session 10 and 11 – Presentation to school and caregivers", "q": "‘I didn’t know the beach had WONDERFUL things’."}], "D8": [{"lab": "INTENDED", "sec": "Methodology", "q": "Through this progression, we intentionally moved children from abstract and representational understandings of the ocean toward embodied and relational ways of knowing, shaped through direct engagement with materials, impermanence and practices of ecological care."}, {"lab": "INTENDED", "sec": "Abstract", "q": "[...] this work illustrates how direct encounters with local ecologies cultivate awareness, curiosity and care"}, {"lab": "OBSERVED", "sec": "Session 2 – Beach Trip", "q": "As soon as we touched the sand, the children began running and exploring."}, {"lab": "OBSERVED", "sec": "Tensions", "q": "Writing engagement was high (18/18), lower in sketching (13/18)."}]}, "syn": {"P5": "<to be written>", "P6": "<to be written>", "Pe5": "<to be written>", "Pe7": "<to be written>", "D1": "<to be written>", "D2": "<to be written>", "D4": "<to be written>", "D5": "<to be written>", "D7": "<to be written>", "D8": "<to be written>"}}, {"name": "Echo of the Abyss", "type": "HCI", "desc": "VR meditation and free-dive simulation set in the deep sea. Users, guided by marine life, explore abyssal ecosystems and perform \"healing\" tasks such as helping an injured whale and repairing bleached coral, while bioluminescence and a gradual body transformation invite more-than-human connection. Pilot-tested at TEI, then evaluated with adult players at CHI.", "papers": [{"title": "Diving into the Abyss: Exploring Deep Sea Connection and Curiosity through Virtual Reality", "doi": "https://doi.org/10.1145/3706598.3713833"}, {"title": "Echo of the Abyss: Understanding More-than-Human Interconnectedness in the Deep Sea through Virtual Reality Experiences", "doi": "https://doi.org/10.1145/3689050.3704432"}], "codes": {"P5": ["INTENDED"], "P6": ["INTENDED", "REPORTED"], "P7": ["INTENDED"], "Pe7": ["INTENDED"], "D3": ["INTENDED", "REPORTED"], "D4": ["INTENDED", "REPORTED"], "D5": ["INTENDED", "REPORTED"], "D7": ["INTENDED", "OBSERVED", "REPORTED"], "D8": ["INTENDED", "OBSERVED", "REPORTED"]}, "ex": {"P5": [{"lab": "INTENDED", "sec": "CHI25 §3.1 The design of Echo of the Abyss", "q": "The intent of EotA’s design is to foster a sense of interconnectedness and curiosity towards the oceans, offering users an experience that closely connects them with various species that they would not typically encounter in real life."}, {"lab": "INTENDED", "sec": "CHI25 §3.2 Echo of the Abyss storyline", "q": "In summary, EotA aims to offer an engaging and immersive VR experience that simulates a deep-sea dive and encourages users to experience and reflect on their connection with the marine environment and its diverse inhabitants."}, {"lab": "INTENDED", "sec": "TEI25 Design of Echo of the Abyss", "q": "EotA conveys a sense of interconnectedness and curiosity toward the seas by giving players the experience of a dive and a closeness to different species that wouldn’t be possible in real life: a seal, a whale, a giant squid, a coral, and a jellyfish."}], "P6": [{"lab": "INTENDED", "sec": "CHI25 §2.3 Promoting Human-Nature Connection through VR Underwater Experiences", "q": "EotA extends a range of work in VR technologies that aim at understanding oceans and bringing attention to the need to evolve the human-ocean relationship to be more sustainable and mindful of oceans’ inhabitants."}, {"lab": "INTENDED", "sec": "TEI25 2nd Design Construct: Challenges", "q": "Both challenges revolve around the theme of healing, with the aim of making the users feel like they have a positive role in and impact on the environment they’re visiting."}, {"lab": "REPORTED", "sec": "CHI25 §5.1.4 Emotional Response to the Animals and the Environment", "q": "Interestingly, participants were also cautious around the animals, careful to give them their space: ”The game wanted you to go too close to the animals; you wouldn’t really do that in real life.” (P3)."}, {"lab": "REPORTED", "sec": "CHI25 §5.1.5 Uncertainty Theme", "q": "In particular, the whale and the seal instilled a feeling of guilt for being too close, and participants reported being cautious and wanting to respect the animal in front of them as if it were real (N=4)."}], "P7": [{"lab": "INTENDED", "sec": "CHI25 Abstract", "q": "This paper presents an investigation of the potential of virtual reality (VR) to bridge the gap between humans and the largely unexplored deep sea, using the immersive, playful experience of ”Echo of the Abyss” (EotA)."}, {"lab": "INTENDED", "sec": "TEI25 Design of Echo of the Abyss", "q": "In particular, the giant squid has only been seen alive a handful of times, since it lives in the abyss, thousands of meters under the surface, a place hardly reachable by humans and still underexplored."}, {"lab": "INTENDED", "sec": "TEI25 Prior Work", "q": "EotA’s design employs narrative transportation [...] to influence and guide players in their deep dive experience [13, 14], maintaining the mysterious nature of the ocean depths while ensuring users feel secure and engaged."}], "Pe7": [{"lab": "INTENDED", "sec": "TEI25 Abstract", "q": "The design leverages theories from HCI, ecopsychology, and hydrocommons to promote environmental stewardship and emotional engagement with the ocean."}, {"lab": "INTENDED", "sec": "CHI25 Abstract", "q": "Our contributions can benefit HCI researchers and game designers interested in designing ocean sustainability-driven experiences and games."}, {"lab": "INTENDED", "sec": "CHI25 §2.3 Promoting Human-Nature Connection through VR Underwater Experiences", "q": "EotA extends a range of work in VR technologies that aim at understanding oceans and bringing attention to the need to evolve the human-ocean relationship to be more sustainable and mindful of oceans’ inhabitants."}], "D3": [{"lab": "INTENDED", "sec": "CHI25 §4 Echo of the Abyss User Study", "q": "EotA aims to make users feel more connected with the deep sea, promoting pro-environmental feelings and behaviours towards seas and aquatic life."}, {"lab": "REPORTED", "sec": "CHI25 §5.1.6 Affect Towards the Sea Theme", "q": "Some (N=4) took it a notch further, thinking about taking action to protect the sea: “I felt like I want to go on a beach clean that I saw the other day on Facebook.” (P2)."}], "D4": [{"lab": "INTENDED", "sec": "CHI25 §3.1 The design of Echo of the Abyss", "q": "The experience features more-than-human animals guiding humans into the depths of the ocean, inviting a bond with the marine creatures and fostering a feeling of interconnectedness, with a sense of kinship and respect for the underwater worlds."}, {"lab": "REPORTED", "sec": "CHI25 Abstract", "q": "The qualitative analysis reveals a heightened empathy, respect for aquatic life, and a newfound interest in real-world diving experiences. Quantitative results indicate a marginal increase in positive perceptions towards the sea."}, {"lab": "REPORTED", "sec": "CHI25 §5.2.1 CNS analysis", "q": "Users became more curious about the sea after experiencing EotA, +4% (Q=10, 11 and 12)."}], "D5": [{"lab": "INTENDED", "sec": "TEI25 Abstract", "q": "EotA’s narrative and interaction strategies are intended to overcome barriers to accessing blue spaces, providing transformative experiences that nurture empathy and ecological consciousness."}, {"lab": "INTENDED", "sec": "TEI25 Hydrocommons", "q": "The concept of hydrocommons in this work brings users’ awareness to their body and how it relates to water immersion and the more-than-human in the experience, shifting the focus from the environment to a more intimate bodily reflection expressed through a transformation of the body."}, {"lab": "REPORTED", "sec": "CHI25 §5.1.5 Uncertainty Theme", "q": "In particular, the whale and the seal instilled a feeling of guilt for being too close, and participants reported being cautious and wanting to respect the animal in front of them as if it were real (N=4)."}], "D7": [{"lab": "INTENDED", "sec": "TEI25 Objectives, Hypotheses and Contribution and Novelty", "q": "Guided by marine animals, players are encouraged to feel awe, comfort, safety, and relaxation."}, {"lab": "INTENDED", "sec": "CHI25 §1 Introduction", "q": "Its primary objective is to explore how VR can enhance feelings of awe, comfort, safety, and relaxation, paving the way for a sense of interconnectedness with marine life."}, {"lab": "OBSERVED", "sec": "CHI25 §5.1.4 Emotional Response to the Animals and the Environment", "q": "From the observation data, most users seemed to enjoy the experience. A few of them (N=6) used the word “wow” while playing different stages of the games."}, {"lab": "REPORTED", "sec": "CHI25 §5.1.1 Experience Immersion Theme", "q": "Many users mentioned relaxation (N=9); however, they also fluctuated between calmness and excitement."}, {"lab": "REPORTED", "sec": "CHI25 §5.2.2 SAM scale analysis", "q": "Overall, the analysis of the SAM scale data reveals that participants generally found the VR experience enjoyable, with high Pleasantness ratings across the overall experience and most scenes"}, {"lab": "REPORTED", "sec": "CHI25 §5.1.6 Affect Towards the Sea Theme", "q": "Some even reconsidered their fear of deep waters: “I am fine when the water is shallow and transparent, but when I look at the deep ocean, it’s scary. But in the game, I liked it. I wasn’t feeling any fear.” (P12)."}], "D8": [{"lab": "INTENDED", "sec": "TEI25 Abstract", "q": "EotA’s narrative and interaction strategies are intended to overcome barriers to accessing blue spaces, providing transformative experiences that nurture empathy and ecological consciousness."}, {"lab": "INTENDED", "sec": "CHI25 §1 Introduction", "q": "We hypothesise that VR immersive applications that provide these experiences, such as EotA, can bridge the emotional and physical distance from the deep sea, creating a sense of curiosity and interconnectedness with the deep sea in users."}, {"lab": "OBSERVED", "sec": "TEI25 Third prototype piloting, still valid", "q": "However, we noted that most freedivers, being accustomed to water pressure, were mimicking a real dive experience, including equalising their ears or trying to hold their breath."}, {"lab": "REPORTED", "sec": "CHI25 §5.1.1 Experience Immersion Theme", "q": "Nearly half the participants reported that the VR experience felt realistic compared to their idea of a real diving experience (N=10)."}, {"lab": "REPORTED", "sec": "CHI25 §5.1.6 Affect Towards the Sea Theme", "q": "Some of the participants (N=9) expressed future plans of reconnection with the sea in real life, for example, learning how to dive: “I want to try diving now! I always thought it was something too far for me, but now I think I could try.” (P18)"}]}, "syn": {"P5": "<to be written>", "P6": "<to be written>", "P7": "<to be written>", "Pe7": "<to be written>", "D3": "<to be written>", "D4": "<to be written>", "D5": "<to be written>", "D7": "<to be written>", "D8": "<to be written>"}}, {"name": "Hackeanos", "type": "HCI", "desc": "Collaborative event format that rethinks the hackathon through an \"okeanic\" lens. Participants appropriate technologies to decode and reconfigure their relationship with the Ocean, jointly promoting Ocean and Digital Literacy. Designed for museums, it counters hackathon competitiveness with slower, systemic, more-than-human thinking. Presented as a conceptual proposal, without implementation or evaluation.", "papers": [{"title": "Hackeanos: A new collaborative event format for hacking the Ocean-humanity relationship", "doi": "https://doi.org/10.1145/3656156.3663722"}], "codes": {"P1": ["INTENDED"], "P6": ["INTENDED"], "Pe5": ["INTENDED"], "Pe7": ["INTENDED"], "D1": ["INTENDED"], "D4": ["INTENDED"], "D5": ["INTENDED"], "D6": ["INTENDED"]}, "ex": {"P1": [{"lab": "INTENDED", "sec": "Abstract", "q": "In hackeanos participants are invited to appropriate technologies in order to decode and reconfigure their relationship with the Ocean—understood as a single interconnected planetary entity."}, {"lab": "INTENDED", "sec": "§3 Introducing Hackeanos", "q": "Second, a whole and agentic understanding of the Ocean, as implied by the ancient Greek word “Ōkeanós”—the mythological one Great Earth-encircling River representing the Earth’s hydrosphere [...]"}], "P6": [{"lab": "INTENDED", "sec": "§3 Introducing Hackeanos", "q": "[...] a research-driven co-design event format aimed at hacking the human-Ocean relationship."}, {"lab": "INTENDED", "sec": "§3 Introducing Hackeanos", "q": "(b) the consideration of a reciprocal “hacking relationship” between humans and the Ocean (coherently with Ocean Literacy’s ultimate purpose of increasing people’s awareness about how we influence the Ocean and the Ocean influences us [21])."}], "Pe5": [{"lab": "INTENDED", "sec": "§3 Introducing Hackeanos", "q": "Overall, this hackeanos aspires to foster the OL \"value perspective\" [21, p.90] in museums through technologies (I.1)."}, {"lab": "INTENDED", "sec": "§5 Conclusion", "q": "By refocusing IOHs to “tidalectic” and “value-based” matters, hackeanos aim to involve technology [...] for hacking (that is, decoding and reprogramming) our relationship with the Ocean."}], "Pe7": [{"lab": "INTENDED", "sec": "§1 Introduction", "q": "Reframed as such, hackathons can uniquely contribute to turning “learning for sustainability” into a “systemic feature of education policy and practice” [...]"}, {"lab": "INTENDED", "sec": "§2 Related Work", "q": "[...] we propose hackeanos as sites for more-than-human material learning, explicitly designed to recalibrate the hackathon format to the long-termism of sustainability challenges."}], "D1": [{"lab": "INTENDED", "sec": "§3 Introducing Hackeanos, Key Impact I.2", "q": "broad knowledge and application of policy frameworks (employed as res-publica)."}, {"lab": "INTENDED", "sec": "§3 Introducing Hackeanos, Key mechanism m.4", "q": "growing ocean-curiosity in tech-inclined participants and vice versa (merging Ocean and Digital Literacy)"}], "D4": [{"lab": "INTENDED", "sec": "§3 Introducing Hackeanos, Key mechanism m.3", "q": "making space for (initial) disagreement, inviting participants to spend time in the “problem space” interrogating each other’s controversial stakes"}, {"lab": "INTENDED", "sec": "§3 Introducing Hackeanos, Key action a.3", "q": "diverging/debating phase addressing m.3, in which participants discuss the posed issue, pointing out the different interest at stake from both human and non-human (natural and technological) agents"}], "D5": [{"lab": "INTENDED", "sec": "§3 Introducing Hackeanos, Key output o.2", "q": "participants’ higher level of awareness and interest in Ocean Literacy (OL) and Digital Literacy (DL)"}], "D6": [{"lab": "INTENDED", "sec": "Abstract", "q": "This paper introduces “hackeanos” [...] an innovative collaborative event format aimed at fostering tech-inspired blue citizenship."}, {"lab": "INTENDED", "sec": "§3 Introducing Hackeanos, Key outcome O.1", "q": "an ever-growing and diffuse \"proto-public\" [17]"}, {"lab": "INTENDED", "sec": "§3 Introducing Hackeanos, Key impact I.1", "q": "a more Ocean-and-Digitally literate society, with a strong and widespread sense of blue citizenship"}]}, "syn": {"P1": "<to be written>", "P6": "<to be written>", "Pe5": "<to be written>", "Pe7": "<to be written>", "D1": "<to be written>", "D4": "<to be written>", "D5": "<to be written>", "D6": "<to be written>"}}, {"name": "MoreGoJelly!", "type": "non-HCI", "desc": "Analogue serious game on marine plastic pollution and jellyfish blooms. High-school students rank four SDGs, then respond to event cards weighing environmental, social and economic sustainability, discussing governance trade-offs; a digital board replaced the physical one during lockdown. Played 2020-2021 in Tromsø, Trondheim and Bergen, with post-game narratives analysed qualitatively.", "papers": [{"title": "Ocean literacy and how serious games can play a part: the case of the jellyfish and the microplastics governance game MoreGoJelly!", "doi": "https://doi.org/10.1017/plc.2024.35"}], "codes": {"P5": ["REPORTED"], "P6": ["INTENDED", "REPORTED"], "Pe1": ["REPORTED"], "Pe5": ["INTENDED", "OBSERVED", "REPORTED"], "Pe7": ["INTENDED", "OBSERVED", "REPORTED"], "D1": ["INTENDED", "REPORTED"], "D4": ["REPORTED"], "D5": ["INTENDED", "REPORTED"]}, "ex": {"P5": [{"lab": "REPORTED", "sec": "Results", "q": "This indicated a reflection around how knowledge gaps on the relationship between actions and consequences in ecosystems can challenge governance, and how they had gained knowledge around the principles on ocean literacy, especially “… (5) the ocean supports a great diversity of life and ecosystems; (6) the ocean and humans are inextricable interconnected….”"}], "P6": [{"lab": "INTENDED", "sec": "Impact statement", "q": "Researchers engaged high school students in three different – but coastal – geographical locations in Norway in gameplay that simulates environmental scenarios, to foster a deeper understanding of marine ecosystems and the impact of human activities on ocean health."}, {"lab": "INTENDED", "sec": "Methodology", "q": "Given that the background for the game was a research project, the topic of the game was to illustrate the twin ocean challenges of both plastic pollution and jellyfish blooms."}, {"lab": "REPORTED", "sec": "Results", "q": "The reason for why we placed SDG 12 at the top was to have less plastics in the ocean because [this leads to] less waste, and [SDG] number 3 was so that people wouldn’t throw things in the ocean so that we would be okay."}, {"lab": "REPORTED", "sec": "Results", "q": "This latter also shows that the students had gained information about how the ocean is affected and that they also saw this in [...] connection with land-based actions, which is critical for ocean literacy and the sixth principle on how “…the ocean and humans are inextricable interconnected…” (Panto, 2019)."}], "Pe1": [{"lab": "REPORTED", "sec": "Results", "q": "The students said that they did not know that jellyfish could be used to capture microplastics, that it could be eaten, or that it could even be a problem."}], "Pe5": [{"lab": "INTENDED", "sec": "Methodology", "q": "By both forcing the groups to actively remove one of the SDGs, and subsequently rank them in terms of their perceived importance, our aim was to demonstrate the difficulties in making choices like these but also for them to reflect on their values vis-a-vis the results at the end of theme"}, {"lab": "INTENDED", "sec": "Methodology", "q": "They had to assess how this event would affect the social, economic and environmental sustainability of the region from −3 (very negative) to +3 (very positive)."}, {"lab": "OBSERVED", "sec": "Results", "q": "They kept SDGs 3 and 12 as the two highest-ranked goals but chose to change from SDG 14 to SDG 8 for their third place as they recognized higher value relating to decent work and economic growth after looking at the SDG cards one more time."}, {"lab": "REPORTED", "sec": "Discussion and conclusion", "q": "Another student said that even though they knew a little about jellyfish and plastics beforehand, what they learned, however, was that when playing the game, and thus making governance choices, they did indeed value environmental choices more than economic ones."}], "Pe7": [{"lab": "INTENDED", "sec": "Abstract", "q": "The games were played within the context of the United Nations Decade of Ocean Science, the sustainable development goals and multilevel governance, with a special focus on microplastic pollution and jellyfish blooms."}, {"lab": "INTENDED", "sec": "Methodology", "q": "After this survey, the participants were provided with contextual cards and an emphasis on these SDGs. We wanted to bring more awareness and contextualization to the concept of SDGs"}, {"lab": "OBSERVED", "sec": "Results", "q": "That is, both groups chose to move SDG 14 – Life below water – above SDG 3 – Good health and well-being when given the opportunity to re-position the order of the goals."}, {"lab": "REPORTED", "sec": "Results", "q": "I believe that this one [SDG 8] is the least important one. Or “decent work” is important to maintain a certain [living] standard, but I don’t know if economic growth is as important when it comes to sustainable development."}], "D1": [{"lab": "INTENDED", "sec": "Methodology", "q": "The latter was done for the participants to gain knowledge and have a background in a real environmental problem, to which the SDGs can be related specifically."}, {"lab": "REPORTED", "sec": "Results", "q": "Each group discussed, and mentioned that, for example, “I knew nothing about jellyfish [before playing the game].”"}, {"lab": "REPORTED", "sec": "Discussion and conclusion", "q": "Still, in our case, with students sampled from three coastal cities in Norway, the students emphasized increased ocean literacy themselves during the game and in the wrap-up session at the end of the gaming session."}], "D4": [{"lab": "REPORTED", "sec": "Results", "q": "In Tromsø, one of the groups said that it was more important to care for the environment than jobs and decent work, even though jobs too were important."}, {"lab": "REPORTED", "sec": "Discussion and conclusion", "q": "[...] they did indeed value environmental choices more than economic ones."}], "D5": [{"lab": "INTENDED", "sec": "Impact statement", "q": "The article assesses that serious games can be an effective tool for environmental education, offering an immersive and interactive experience that traditional teaching methods may lack, which can lead to not only increased awareness among students about marine issues but also motivate them to learn more and take action."}, {"lab": "INTENDED", "sec": "Methodology", "q": "We wanted to bring more awareness and contextualization to the concept of SDGs"}, {"lab": "REPORTED", "sec": "Discussion and conclusion", "q": "One student also said that they were surprised about the complexity around the task of solving environmental challenges and that there was so much more to it than they had ever imagined."}]}, "syn": {"P5": "<to be written>", "P6": "<to be written>", "Pe1": "<to be written>", "Pe5": "<to be written>", "Pe7": "<to be written>", "D1": "<to be written>", "D4": "<to be written>", "D5": "<to be written>"}}, {"name": "Ocean Literacy Recycling Game", "type": "non-HCI", "desc": "Prototype mobile game, named \"Ocean Literacy\" in the papers: players sort falling items into the right recycling bins; mistakes darken the water and kill the fish below. Versions isolating points, badges, leaderboard and the full PBL triad were compared with a lecture-only control among 11-14-year-olds in Portugal and the UK, measuring motivation and learning.", "papers": [{"title": "A systematic evaluation of game elements effects on students' motivation", "doi": "https://doi.org/10.1007/s10639-021-10651-8"}, {"title": "Ocean literacy gamified: A systematic evaluation of the effect of game elements on students’ learning experience", "doi": "https://doi.org/10.1080/13504622.2021.1986469"}], "codes": {"P3": ["INTENDED", "REPORTED"], "P6": ["INTENDED", "REPORTED"], "Pe1": ["INTENDED", "REPORTED"], "Pe7": ["INTENDED", "REPORTED"], "D1": ["INTENDED", "REPORTED"], "D3": ["INTENDED"], "D4": ["REPORTED"], "D5": ["INTENDED", "REPORTED"]}, "ex": {"P3": [{"lab": "INTENDED", "sec": "EER22 Abstract", "q": "In this study, we explored ways to address low levels of understanding about ocean science dimensions to climate change phenomena, cognisant of a growing awareness that formal education curricula do not adequately engage young people with developing ocean literacy."}, {"lab": "INTENDED", "sec": "EER22 Method", "q": "The questionnaire was developed based on the topics: eutrophication, sea-level rise and plastic pollution in the ocean (the intended learning outcomes)."}, {"lab": "REPORTED", "sec": "EER22 Results, Session 1", "q": "The questions with the highest percentage of correct responses were related to the sea-level rise (100%) and fish contaminated by plastic (>80%)."}], "P6": [{"lab": "INTENDED", "sec": "EIT21 §6.1 Points condition", "q": "The outcomes of the application were to help students understand ocean literacy topics and, at the same time, connect our behaviours to the effects on the ocean."}, {"lab": "INTENDED", "sec": "EIT21 §6.2 Badges condition", "q": "Every time the user reached one of the three badges, a window popped up congratulating the user, explaining a certain topic and relating it to our behaviour."}, {"lab": "REPORTED", "sec": "EER22 Results, Session 4", "q": "They felt they had learnt new recycling information and consequently the effects on the ocean: ‘Very interesting to understand why the environment is being harmed’"}], "Pe1": [{"lab": "INTENDED", "sec": "EER22 Abstract", "q": "In this study, we explored ways to address low levels of understanding about ocean science dimensions to climate change phenomena"}, {"lab": "INTENDED", "sec": "EER22 Method", "q": "This initial 15-minutes presentation, as well as the design of the slideshow, in both countries, were made by experienced science educators."}, {"lab": "REPORTED", "sec": "EER22 Results, Overall results", "q": "As to the game elements, the post-hoc analysis by the Dunnett test revealed that Points, Badges and the PBL triad all increased the learning outcome significantly by about 30%, compared to the control group (p < 0.05, Figure 3)."}], "Pe7": [{"lab": "INTENDED", "sec": "EIT21 Abstract", "q": "The main aims of this work were: i) to understand through a systematic evaluation, how game elements affect the different motivation layers; and ii) to compare them in terms of enhancing the motivation to recycle among secondary school students (11-14 years)."}, {"lab": "INTENDED", "sec": "EIT21 §8 Conclusions", "q": "Considering this, these interactive technologies seem to have the potential to deliver more effective education for sustainable development than conventional teaching approaches."}, {"lab": "REPORTED", "sec": "EER22 Results, Session 1", "q": "Some participants made some comments regarding their learning experience: ‘It teaches you how to recycle’; It tells you what goes to the bin’ [United Kingdom pupils]; ‘Who doesn’t know can learn about recycling’ [Portuguese student]."}], "D1": [{"lab": "INTENDED", "sec": "EER22 Introduction", "q": "Therefore, this study was conducted to understand if there is any relationship between different game elements, such as points, badges, leaderboards (also known as the PBL triad), and learning outcomes of ocean literacy."}, {"lab": "INTENDED", "sec": "EER22 Method", "q": "As pupils progressed through the game, potentially being motivated by particular game elements, they were shown more information about the ocean, which increased their knowledge."}, {"lab": "REPORTED", "sec": "EER22 Discussion, Are the game elements useful in learning?", "q": "The overall results show the average of correct answers was over 70% with the mobile application (all conditions), while only with oral explanation and the slide show sessions, the average was less than 60%."}, {"lab": "REPORTED", "sec": "EER22 Conclusion", "q": "Many students stated that they felt they had learned a lot about the ocean during the test sessions."}], "D3": [{"lab": "INTENDED", "sec": "EIT21 §3 Research tool - matching motivation to game elements", "q": "This study started from the research question: can different game elements affect students’ motivation to recycle and, if so, how?"}], "D4": [{"lab": "REPORTED", "sec": "EIT21 §5.3 Comparison", "q": "Furthermore, identified regulation overall results suggest that in both countries a [...] high percentage of students consider these ocean topics personally important, reinforcing the previous findings (Leitão et al., 2018)."}], "D5": [{"lab": "INTENDED", "sec": "EIT21 §3 Research tool - matching motivation to game elements", "q": "The present study intended to understand how interacting with a mobile gamified application about ocean literacy topics in learning activities can raise awareness of the impact that our daily choices have on the marine ecosystem."}, {"lab": "INTENDED", "sec": "EER22 Discussion, Effect of different game elements", "q": "Given this, badges were not used as a contingent reward but rather as a tool for raising the awareness of some of the environmental problems we face and how they arise."}, {"lab": "REPORTED", "sec": "EER22 Results, Session 2", "q": "At the end of the application experience, the students stated they understood the educational content well and learned from the interaction with the application: ‘Learned not to leave plastic lying around’"}]}, "syn": {"P3": "<to be written>", "P6": "<to be written>", "Pe1": "<to be written>", "Pe7": "<to be written>", "D1": "<to be written>", "D3": "<to be written>", "D4": "<to be written>", "D5": "<to be written>"}}, {"name": "ResponSEAble Game", "type": "non-HCI", "desc": "Single-player mobile game from the EU H2020 ResponSEAble project. Starting from an island, players navigate the ocean using limited \"movement points\", completing quizzes and missions tied to six Key Stories (e.g. microplastics in cosmetics, invasive species, sustainable fisheries) to become \"ocean literate\". Co-designed with a living lab and released on app stores in 2018.", "papers": [{"title": "A Game for Learning Ocean Literacy: The ResponSEAble Project", "doi": "https://doi.org/10.1080/10572317.2019.1629067"}], "codes": {"P6": ["INTENDED"], "Pe5": ["IMPLIED"], "Pe7": ["INTENDED"], "D1": ["INTENDED"], "D3": ["INTENDED"], "D4": ["INTENDED"], "D5": ["INTENDED"], "D6": ["INTENDED"]}, "ex": {"P6": [{"lab": "INTENDED", "sec": "The ResponSEAble project", "q": "The goal of the ResponSEAble project was to raise awareness about ocean reciprocal influence, between humans and sea."}, {"lab": "INTENDED", "sec": "The ResponSEAble project", "q": "The Key Stories—microplastics in cosmetics, eutrophication and agriculture, invasive species and ballast water-hull fouling, marine renewable energy, sustainable fisheries & aquaculture, coastal tourism-drove the whole development of the Ocean Literacy Tools (OLT)."}, {"lab": "INTENDED", "sec": "The game ResponSEAble", "q": "[...] the project ResponSEAble set up an interactive game for children and adults to facilitate the understanding of these complex phenomena."}], "Pe5": [{"lab": "IMPLIED", "sec": "The game ResponSEAble", "q": "The Mechanic of the game requires the player to overcome several challenges related to the key stories linked to the health of our ocean and the connected value chain to become “ocean literate”"}], "Pe7": [{"lab": "INTENDED", "sec": "The design process", "q": "The ResponSEAble app game aims to provide information, improve knowledge and facilitate reflections on the sustainability of everyday actions"}, {"lab": "INTENDED", "sec": "The ResponSEAble project", "q": "Following to these assumptions and to accomplish the aims of the project—develop communication material that will sensitize individual and collective responsibility and interest in ensuring the sustainability of the ocean and its ecosystems—the consortium focused of four questions about knowledge related to OL"}], "D1": [{"lab": "INTENDED", "sec": "The design process", "q": "The ResponSEAble app game aims to provide information, improve knowledge and facilitate reflections on the sustainability of everyday actions"}, {"lab": "INTENDED", "sec": "The design process", "q": "Knowledge a. For each of the 5 key stories, the game provides at the first stage, a short unit of information and after a quiz to measure the players’ knowledge"}], "D3": [{"lab": "INTENDED", "sec": "The game ResponSEAble", "q": "It has been shown that a videogame is an effective tool in changing behavior and its efficacy is already recognized in the health sector9: for this reason, the project ResponSEAble set up an interactive game for children and adults to facilitate the understanding of these complex phenomena."}, {"lab": "INTENDED", "sec": "The design process", "q": "The player has two decisions to take, in which he/she is invited in acting following what they have learned during the game. If the decisions are wrong, the players have to restart the entire key story."}], "D4": [{"lab": "INTENDED", "sec": "The design process", "q": "The structure of the game and the questions are implemented following the [...] knowledge–attitude-behavior approach (Schrader and Lawless, 2004) and improve different dimensions of OL, through its structure and the different types of activities proposed in the game"}, {"lab": "INTENDED", "sec": "The design process", "q": "Attitude/behavior a. After the quizzes, a scenario is proposed, essentially, it’s a story with a plot, characters and a problem that players have to resolve."}], "D5": [{"lab": "INTENDED", "sec": "Abstract", "q": "The ResponSEAble project, funded by the H2020 European program, aims to increase the awareness of European people about the impact of the Ocean, called Ocean Literacy. The focus is about the development of the applied game on Ocean Literacy."}, {"lab": "INTENDED", "sec": "The ResponSEAble project", "q": "[...] it is necessary to make explicit the causal relationships between people’s actions and the state of our seas."}], "D6": [{"lab": "INTENDED", "sec": "The design process", "q": "Activism a. When the player completes the game, he/she is asked to take a selfie that will be published in the leader board: their photos [...] witness that they are acting in a first person to protect the ocean."}, {"lab": "INTENDED", "sec": "The ResponSEAble project", "q": "For engaging people, to be more informed but also starting to act as “changemaker”, the project used the power of storytelling, creating six so-called “Key Stories”."}]}, "syn": {"P6": "<to be written>", "Pe5": "<to be written>", "Pe7": "<to be written>", "D1": "<to be written>", "D3": "<to be written>", "D4": "<to be written>", "D5": "<to be written>", "D6": "<to be written>"}}, {"name": "SeAdventure", "type": "non-HCI", "desc": "Serious game set in the Mediterranean Sea: children play as one of four at-risk marine species, swimming through litter, scoring by eating fish and losing lives by swallowing trash, while knowledge pills explain each species' habitat, diet and threats. Used within an educational path with an explainer video on plastic pollution and teacher-led brainstorming.", "papers": [{"title": "Multimedia Technologies to Foster Ecological Skills", "doi": "https://doi.org/10.1109/ICALT.2017.76"}, {"title": "A Serious Game to Promote Environmental Attitude", "doi": "https://doi.org/10.1007/978-3-319-59451-4_5"}, {"title": "Promoting Sustainable Behavior Using Serious Games: SeAdventure for Ocean Literacy", "doi": "https://doi.org/10.1109/ACCESS.2020.3034438"}], "codes": {"P5": ["INTENDED", "REPORTED"], "P6": ["INTENDED", "REPORTED"], "Pe1": ["INTENDED", "REPORTED"], "Pe7": ["INTENDED", "REPORTED"], "D1": ["INTENDED", "REPORTED"], "D3": ["INTENDED", "OBSERVED", "REPORTED"], "D4": ["INTENDED"], "D5": ["INTENDED", "REPORTED"], "D7": ["INTENDED"], "D8": ["INTENDED"]}, "ex": {"P5": [{"lab": "INTENDED", "sec": "IEEE Access20 Abstract", "q": "The aim of the serious game was to enhance ocean literacy with a particular attention to the biodiversity of the Apulian and Mediterranean sea to raise children’s awareness of the issue of caring for life in the sea."}, {"lab": "INTENDED", "sec": "IEEE Access20 §IV.B SeAdventure: The Serious Game", "q": "Moreover, in order to support the acquisition of knowledge on Mediterranean species, for each character are spread during the game some knowledge pills about character’s habitat, diet, lifestyle and dangers (Fig. 2)."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VI.A Learning Effectiveness", "q": "The analysis of data (Table 1) shows that the average number of wrong answers in the post-test is overall lower than in the pre-test. The learning gain is 3.16 in post-test and 4.12 in retention test."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VI.B User’s Perceived Usability", "q": "Data are very promising, indeed 44 out 50 users believed that they have increased their knowledge about marine species and pollution by using the game"}], "P6": [{"lab": "INTENDED", "sec": "ICALT17 §II.D Plastic Sea: The Explainer Video", "q": "In other words, the video focuses on two important ecological issues: (1) the connection between the health of the marine environment and the health of humans; (2) the importance of proper waste disposal."}, {"lab": "INTENDED", "sec": "SEEL17 §3 Serious Game for Environmental Education: Related Works", "q": "Our game invites to reflect on the consequences of waste in the sea and how these wastes end up in the products we eat."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VI.A Learning Effectiveness", "q": "It was interesting that for questions such as ‘‘Plastic bags and other rubbish can kill marine animals both because the animals can eat the plastic and because they can get trapped in it?’’ and ‘‘The waste we throw on the beach stays there, without ending up in the sea?’’ all pupils in the post-test gave correct answers"}], "Pe1": [{"lab": "INTENDED", "sec": "IEEE Access20 §III Background", "q": "From the content point of view, differently to other solutions in the literature that focus on right human behaviors, the proposed solution provides some information about scientific aspects of the marine species, this is important both to improve children’s scientific knowledge and to encourage children to preserve the marine world and life in it."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VI.A Learning Effectiveness", "q": "The learning gain is 3.16 in post-test and 4.12 in retention test. This demonstrates that the use of the SeAdventure game is useful to acquire new knowledge."}], "Pe7": [{"lab": "INTENDED", "sec": "IEEE Access20 Title", "q": "Promoting Sustainable Behavior Using Serious Games: SeAdventure for Ocean Literacy"}, {"lab": "INTENDED", "sec": "IEEE Access20 §IV.B SeAdventure: The Serious Game", "q": "This concept should foster sustainable behaviour, since the children should learn that the conscious collection of waste avoids the dispersion of waste into the sea."}, {"lab": "REPORTED", "sec": "IEEE Access20 §V.B.2 Procedure", "q": "Initially, all students underwent a pre-test consisting of 19 questions related to both sustainable behaviors and habits of Mediterranean species, namely the content of knowledge pills in the serious game."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VI.A Learning Effectiveness", "q": "The analysis of data (Table 1) shows that the average number of wrong answers in the post-test is overall lower than in the pre-test."}], "D1": [{"lab": "INTENDED", "sec": "IEEE Access20 §II Game-Based Learning Approach", "q": "The aim is to encourage the acquisition of knowledge about the marine life using an active learning approach."}, {"lab": "INTENDED", "sec": "SEEL17 Abstract", "q": "The aim is to foster knowledge about the marine life and to explain people the problems that marine litter can cause."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VI.A Learning Effectiveness", "q": "The learning gain is 3.16 in post-test and 4.12 in retention test. This demonstrates that the use of the SeAdventure game is useful to acquire new knowledge."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VII Conclusion and Future Works", "q": "The interesting outcome of this evaluation was the results of the retention test, which have confirmed that the knowledge gained has been actually acquired by children."}], "D3": [{"lab": "INTENDED", "sec": "IEEE Access20 §IV The Educational Path", "q": "The main objective of our educational solutions was to promote a change in children’s behaviors by leveraging the emotion experienced both in the video and in the game."}, {"lab": "INTENDED", "sec": "IEEE Access20 §I Introduction and Motivation", "q": "The serious game, named SeAdventure [13], [14], aimed at fostering the theme of sea protection through the promotion of behavior able to reduce the spread of marine litter."}, {"lab": "OBSERVED", "sec": "IEEE Access20 §VII Conclusion and Future Works", "q": "Moreover, the teachers also reported that some children have applied the new good habits in daily practice trying to dispose of waste in the classroom in the best possible way."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VI.A Learning Effectiveness", "q": "During the discussion after the retention test, the teachers asked to pupils if they change the way they act. All children were proud of the fact that they had carefully collected the rubbish on the beach during the summer to prevent it from ending up in the sea."}], "D4": [{"lab": "INTENDED", "sec": "SEEL17 Title", "q": "A Serious Game to Promote Environmental Attitude"}, {"lab": "INTENDED", "sec": "SEEL17 §6 Conclusions and Future Works", "q": "In this view, the research presents a serious game addressed to primary school pupils to foster ecological skills and environmental attitudes."}], "D5": [{"lab": "INTENDED", "sec": "IEEE Access20 Abstract", "q": "The aim of the serious game was to enhance ocean literacy with a particular attention to the biodiversity of the Apulian and Mediterranean sea to raise children’s awareness of the issue of caring for life in the sea."}, {"lab": "INTENDED", "sec": "IEEE Access20 §IV.B SeAdventure: The Serious Game", "q": "The idea is to make the user aware of the difficulty that fishes have in avoiding all the rubbish disseminated into the sea."}, {"lab": "REPORTED", "sec": "IEEE Access20 §VI.A Learning Effectiveness", "q": "[...] all pupils in the post-test gave correct answers, whereas in the pre-test some of them (10%) [...] thought that plastic and beach waste were not a problem for the sea and its inhabitants."}], "D7": [{"lab": "INTENDED", "sec": "IEEE Access20 §IV The Educational Path", "q": "The main objective of our educational solutions was to promote a change in children’s behaviors by leveraging the emotion experienced both in the video and in the game."}], "D8": [{"lab": "INTENDED", "sec": "IEEE Access20 §I Introduction and Motivation", "q": "However, experiences in natural context are not often possible due to economic reasons or distances. In addition, some kinds of environments, such as the ocean, [...] are difficult to visit or to reach. Thus the new technologies and the virtual environments can help to overcome these limits. In this view, a multimedia educational path, composed of an explainer video and a serious game, has been designed and developed."}, {"lab": "INTENDED", "sec": "IEEE Access20 §IV The Educational Path", "q": "To make children aware of the need to preserve the environment, it is also essential that they become familiar with marine environment and the species living in it."}]}, "syn": {"P5": "<to be written>", "P6": "<to be written>", "Pe1": "<to be written>", "Pe7": "<to be written>", "D1": "<to be written>", "D3": "<to be written>", "D4": "<to be written>", "D5": "<to be written>", "D7": "<to be written>", "D8": "<to be written>"}}, {"name": "The Blue Bounty", "type": "non-HCI", "desc": "Augmented-reality board game co-designed with university students. In teams, players take the roles of commercial fisher, tourism entrepreneur and energy-company manager, answering quiz cards and making decisions on ocean economic activities and pressures. A pre/post study against a traditional lecture measured six OL dimensions with 36 UK university students.", "papers": [{"title": "An augmented reality board game to work ocean literacy dimensions", "doi": "https://doi.org/10.1007/s10639-025-13519-3"}], "codes": {"P6": ["INTENDED", "REPORTED"], "Pe1": ["REPORTED"], "Pe5": ["INTENDED"], "Pe7": ["INTENDED", "REPORTED"], "D1": ["INTENDED", "REPORTED"], "D2": ["INTENDED", "REPORTED"], "D3": ["INTENDED", "REPORTED"], "D4": ["INTENDED", "REPORTED"], "D5": ["INTENDED", "REPORTED"], "D6": ["INTENDED", "REPORTED"]}, "ex": {"P6": [{"lab": "INTENDED", "sec": "§3.1 AR board game design: A Participatory approach", "q": "The prototype is related to main ocean economic activities and potential pressures; fisheries, tourism and energy. The game was thought to involve the roles of a commercial fisherman, a tourism entrepreneur and an energy company manager, representing in this way different scales of enterprises in the ocean economy."}, {"lab": "INTENDED", "sec": "§2 Enhancing ocean literacy: information and engagement strategies", "q": "i) a multirole simulation to comprehensively present the topic and enable students to understand the interaction between the different roles."}, {"lab": "REPORTED", "sec": "§5.2 Awareness dimension", "q": "Nevertheless, the board game has shown to be effective in increasing this dimension and, consequently, the understanding of the solutions and behaviours that may exist to address these problems."}, {"lab": "REPORTED", "sec": "§3.2 Effect of the AR board game on literacy dimensions, Table 2 (Awareness items)", "q": "The unsustainable human activities on the ocean damage its ecosystem and the ability to provide resources on which human depends"}], "Pe1": [{"lab": "REPORTED", "sec": "§5.1 Knowledge dimension", "q": "This study revealed the AR board game was able to significantly increase knowledge and awareness, compared to the control group, acting also on the other dimensions assessed."}], "Pe5": [{"lab": "INTENDED", "sec": "§4.1 The blue bounty board game", "q": "The fourth mechanic was thought to balance the ocean’s benefits and health (Fig. 5). Players build corresponding facilities within the territories they occupy. Their ocean-related actions result in profits while exerting negative effects on the ocean."}, {"lab": "INTENDED", "sec": "§4.1 The blue bounty board game", "q": "It allows competition between different groups of players, the winning group determined by the highest ocean health points and comprehensive [...] economic gains."}, {"lab": "INTENDED", "sec": "Keywords", "q": "Ecosystem services · Energy · Fisheries · Game-based learning · Ocean economic activities and pressures · Tourism"}], "Pe7": [{"lab": "INTENDED", "sec": "§4.1 The blue bounty board game", "q": "At this point, players can invest in remediation efforts aimed at restoring the impacted ocean. Players can only recover negative impacts caused by themselves."}, {"lab": "INTENDED", "sec": "§2 Enhancing ocean literacy: information and engagement strategies", "q": "The results obtained were useful to gain insight into how to design more engaging educational tools and strategies for enhancing pro-environmental behaviours."}, {"lab": "REPORTED", "sec": "§4.2 Quantitative assessment of the blue bounty’s impact on the ocean literacy dimensions", "q": "Responses also showed a significant effect on the students’ behaviours (Fig. 7, Table 3) suggesting they were more engaged in improving their lifestyle choices and pro-environmental habits, as well as in taking action to reduce the negative effects of coastal tourism."}], "D1": [{"lab": "INTENDED", "sec": "§2 Enhancing ocean literacy: information and engagement strategies", "q": "The working hypothesis was that the AR board game co-designed within the Design, Play and Experience (DPE) framework (Winn, 2009) could be more effective in increasing students’ knowledge and other relevant dimensions than the classical teaching approach."}, {"lab": "REPORTED", "sec": "§5.1 Knowledge dimension", "q": "This study revealed the AR board game was able to significantly increase knowledge and awareness, compared to the control group, acting also on the other dimensions assessed."}], "D2": [{"lab": "INTENDED", "sec": "§2 Enhancing ocean literacy: information and engagement strategies", "q": "Besides knowledge, the dimensions considered were awareness, attitude, communication, behaviour and activism."}, {"lab": "INTENDED", "sec": "§2 Enhancing ocean literacy: information and engagement strategies", "q": "iv) player interactions, allowing participants to share their views on public issues with others."}, {"lab": "REPORTED", "sec": "§4.2 Quantitative assessment of the blue bounty’s impact on the ocean literacy dimensions", "q": "The results suggest it had a strong effect on students’ willingness to discuss ways of mitigating the problems we cause in the ocean with family, friends and colleagues."}], "D3": [{"lab": "INTENDED", "sec": "§2 Enhancing ocean literacy: information and engagement strategies", "q": "Consequently, this research aimed developing an AR game-based educational tool within the ocean literacy context and to explore how this could help improve engagement with different ocean dimensions, clarify how they may relate to each other and if they could trigger behavioural change."}, {"lab": "REPORTED", "sec": "§4.2 Quantitative assessment of the blue bounty’s impact on the ocean literacy dimensions", "q": "Responses also showed a significant effect on the students’ behaviours (Fig. 7, Table 3) suggesting they were more engaged in improving their lifestyle choices and pro-environmental habits"}], "D4": [{"lab": "INTENDED", "sec": "§2 Enhancing ocean literacy: information and engagement strategies", "q": "Besides knowledge, the dimensions considered were awareness, attitude, communication, behaviour and activism."}, {"lab": "REPORTED", "sec": "§4.2 Quantitative assessment of the blue bounty’s impact on the ocean literacy dimensions", "q": "They were [...] more aware of the problems our ocean is facing and more motivated to support projects to restore the health of the ocean."}], "D5": [{"lab": "INTENDED", "sec": "§4.1 The blue bounty board game", "q": "The events included in this mechanic became connected to respective areas on the game board, making clearer connections to impacts and thus promote environmental awareness (Fig. 4)."}, {"lab": "REPORTED", "sec": "§5.2 Awareness dimension", "q": "The research findings indicate that students started with a good awareness of the environmental challenges facing the ocean. Nevertheless, the board game has shown to be effective in increasing this dimension"}], "D6": [{"lab": "INTENDED", "sec": "§2 Enhancing ocean literacy: information and engagement strategies", "q": "iii) reflective goals where players must adopt critical thinking, consider the development of others and undertake actions to safeguard the public interest"}, {"lab": "REPORTED", "sec": "§4.2 Quantitative assessment of the blue bounty’s impact on the ocean literacy dimensions", "q": "The activism dimension also increased with the intervention suggesting that the students were more motivated to engaged and participating in activities such as attending public pro-environmental events or campaigning through social media."}]}, "syn": {"P6": "<to be written>", "Pe1": "<to be written>", "Pe5": "<to be written>", "Pe7": "<to be written>", "D1": "<to be written>", "D2": "<to be written>", "D3": "<to be written>", "D4": "<to be written>", "D5": "<to be written>", "D6": "<to be written>"}}, {"name": "Topnaar VR Experience", "type": "HCI", "desc": "Short VR experience embedding Ocean Literacy in a traditional narrative of the Topnaar, an Indigenous people of Namibia. Users first collect seaweed along the shore, echoing its role in Topnaar medicine, then descend to the seabed, where kelp illustrates OL Principle 4: the ocean makes Earth habitable. Pilot-tested and refined with researchers.", "papers": [{"title": "Promoting Ocean Stewardship by Embedding an Ocean Literacy VR Experience in a Traditional Topnaar Narrative", "doi": "https://doi.org/10.1145/3788851.3815051"}], "codes": {"P4": ["INTENDED", "REPORTED"], "P6": ["INTENDED", "REPORTED"], "Pe1": ["INTENDED", "REPORTED"], "Pe6": ["INTENDED", "OBSERVED", "REPORTED"], "D1": ["INTENDED", "REPORTED"], "D4": ["INTENDED"], "D7": ["INTENDED", "OBSERVED", "REPORTED"], "D8": ["INTENDED", "OBSERVED"]}, "ex": {"P4": [{"lab": "INTENDED", "sec": "§3.3 VR Experience Design", "q": "Following the Topnaar context a transition into an ecological excursion to the bottom of the sea explains that Kelp forests and phytoplankton are essential contributors to global oxygen production [9]. This progression reinforces the concept that the ocean plays a fundamental role in maintaining Earth’s habitability."}, {"lab": "INTENDED", "sec": "§3.3.1 Experience Overview", "q": "After the coastal experience, the user transitions into an underwater environment focused on Ocean Literacy Principle 4, which emphasises that the ocean makes Earth habitable."}, {"lab": "REPORTED", "sec": "§3.6 Evaluation", "q": "Participants demonstrated comprehension of the experience, they reported learning that seaweed can be used for healing, that underwater plant life contributes oxygen to the Earth, and that a significant portion of oxygen comes from the sea."}], "P6": [{"lab": "INTENDED", "sec": "Abstract", "q": "The VR application, which has been co-created with members of the Topnaar community, allows for an embodied experience of collecting healing seaweed, while being accompanied by a Topnaar narrator [...]"}, {"lab": "INTENDED", "sec": "§3.3.1 Experience Overview", "q": "An auditory narration introduces elements of Topnaar culture and their relationship with the ocean."}, {"lab": "REPORTED", "sec": "§3.6 Evaluation", "q": "[...] they reported learning that seaweed can be used for healing [...]"}, {"lab": "REPORTED", "sec": "Discussion and Conclusion", "q": "Participants recalled concepts related to the Topnaar people’s interactions with the ocean, including its role as a source of food, healing, and cultural meaning."}], "Pe1": [{"lab": "INTENDED", "sec": "§3.3 VR Experience Design", "q": "[...] a transition into an ecological excursion to the bottom of the sea explains that Kelp forests and phytoplankton are essential contributors to global oxygen production [9]."}, {"lab": "REPORTED", "sec": "Discussion and Conclusion", "q": "Despite participants expressing a visual preference for the underwater environment, articulated learning covered cultural and ecological facts."}], "Pe6": [{"lab": "INTENDED", "sec": "Abstract", "q": "This study aimed to develop a VR experience, which embeds ocean literacy in a cultural narrative of the Topnaar people."}, {"lab": "INTENDED", "sec": "§3.1 Research design", "q": "Within this framework, culture was treated as a foundational design resource rather than a supplementary consideration, allowing cultural perspectives to meaningfully inform the development of content."}, {"lab": "REPORTED", "sec": "Discussion and Conclusion", "q": "Participants recalled concepts related to the Topnaar people’s interactions with the ocean, including its role as a source of food, healing, and cultural meaning."}, {"lab": "OBSERVED", "sec": "Discussion and Conclusion", "q": "This suggests that cultural framing played a significant role in shaping how participants interpreted and retained ocean literacy content."}], "D1": [{"lab": "INTENDED", "sec": "Discussion and Conclusion", "q": "This study set out to design and implement a virtual reality application aimed at introducing ocean literacy concepts through an immersive Topnaar cultural narrative."}, {"lab": "REPORTED", "sec": "§3.6 Evaluation", "q": "Several participants were able to accurately recall and repeat phrases from the narration, suggesting improved understanding and short-term retention of key concepts."}], "D4": [{"lab": "INTENDED", "sec": "Title", "q": "Promoting Ocean Stewardship by Embedding an Ocean Literacy VR Experience in a Traditional Topnaar Narrative"}, {"lab": "INTENDED", "sec": "Discussion and Conclusion", "q": "Following these preliminary findings, further research will be conducted to explore long-term effects and most importantly attitude change among users in promoting stewardship."}], "D7": [{"lab": "INTENDED", "sec": "Introduction", "q": "Thus advancing ocean literacy requires moving beyond scientific or economic narratives and fostering emotional, historical, and cultural connections to the ocean."}, {"lab": "INTENDED", "sec": "§3.3.3 Narration and Pacing", "q": "Each voice line was intentionally designed to serve a specific purpose, such as evoking an emotional response, prompting user action, or introducing contextual information related to the scene."}, {"lab": "REPORTED", "sec": "§3.4 Pilot Testing, still valid: underwater scene unchanged", "q": "All participants were delighted by the underwater scene which they verbally expressed during and after the experience."}, {"lab": "REPORTED", "sec": "Abstract", "q": "Preliminary user evaluations confirm awe effects [...]"}, {"lab": "OBSERVED", "sec": "Discussion and Conclusion", "q": "Participant expressions of enjoyment indicate a level of affective involvement that is often considered a prerequisite for effective educational engagement in immersive media."}], "D8": [{"lab": "INTENDED", "sec": "Introduction", "q": "Consequently, much of the population has limited exposure to marine environments resulting in many Namibians reaching adulthood with little first-hand experience of the ocean [9]."}, {"lab": "INTENDED", "sec": "§3.3 VR Experience Design", "q": "[...] the possibility to recreate an embodied realistic experience of collecting the seaweed along the shore."}, {"lab": "OBSERVED", "sec": "§3.4 Pilot Testing, still valid", "q": "The application was considered usable with all participants able to complete the experience, listening to the narrative and interacting with the seaweed."}]}, "syn": {"P4": "Dyakugha et al. address Principle 4 by name. After the coastal scene, the user descends to the seabed, where the narration explains that kelp forests and phytoplankton are major contributors to global oxygen production, framing the ocean as what keeps Earth habitable. In the evaluation, participants reported having learnt that underwater plant life produces oxygen and that a significant share of Earth's oxygen comes from the sea.", "P6": "The human–ocean connection is conveyed through the Topnaar's own relationship with the sea. Users collect seaweed on the shore, echoing its traditional use in healing, while a Topnaar narrator introduces how the community relates to the ocean. Afterwards, participants recalled that seaweed can be used for healing and described the ocean as a source of food, healing and cultural meaning for the Topnaar.", "Pe1": "The scientific perspective enters through the underwater segment, which follows the cultural one and presents an ecological fact: the role of kelp and phytoplankton in oxygen production. The authors note that what participants articulated afterwards included ecological as well as cultural facts.", "Pe6": "Culture is the backbone of the design. Ocean Literacy content is embedded in a traditional Topnaar narrative, co-created with community members, and the authors treat culture as a foundational design resource rather than an add-on. Participants recalled the Topnaar's ways of relating to the ocean, and the authors read this as a sign that the cultural framing shaped how the Ocean Literacy content was interpreted and retained.", "D1": "Knowledge is the experience's explicit aim: it is designed to introduce Ocean Literacy concepts through the Topnaar narrative. Participants reported specific facts they had learnt (healing seaweed, oxygen from the sea), and several could recall and repeat phrases from the narration, which the authors take as a sign of short-term retention.", "D4": "Attitude appears as an aim rather than a measured outcome. The title frames the experience as a way of promoting ocean stewardship, but the authors explicitly defer the study of attitude change to future research.", "D7": "Emotional engagement is built into the design. The authors argue that Ocean Literacy must go beyond scientific and economic narratives towards emotional connections, and each voice line was written with a purpose, including evoking an emotional response. Pilot participants voiced their delight at the underwater scene, and the authors report awe effects and expressions of enjoyment, which they read as affective involvement.", "D8": "The experience responds to many Namibians reaching adulthood with little first-hand experience of the ocean. VR is used to recreate an embodied, realistic experience of collecting seaweed along the shore and descending underwater. In the pilot, all participants could complete the experience and interact with the seaweed: evidence that the access works, not yet of a changed relationship with the ocean."}}], "slots": {"Pe1": {"c": [367.7, 144.2], "t": [0.9297, 0.3683], "n": [0.3683, -0.9297], "half": 26.0, "ext": 0.2, "fam": "Pe", "fill": [[362.5, 150.1], [370.5, 136.2], [378.5, 150.1], [354.5, 136.2], [370.5, 164.0], [386.5, 136.2], [346.5, 150.1], [362.5, 122.2], [354.5, 164.0], [386.5, 164.0], [394.5, 150.1], [338.5, 136.2], [346.5, 122.2], [402.5, 136.2], [330.5, 150.1], [
