517.5, 494.5], [525.5, 508.4]]}}, "names": {"P1": "One Big Ocean", "P2": "Earth-shaper", "P3": "Climate Regulator", "P4": "Life-enabler", "P5": "Greatly Diverse", "P6": "Interconnected with Humans", "P7": "Largely Unknown", "Pe1": "Science", "Pe2": "History", "Pe3": "Geography", "Pe4": "Gender Equity", "Pe5": "Value", "Pe6": "Culture", "Pe7": "Sustainability", "D1": "Knowledge", "D2": "Communication", "D3": "Behaviour", "D4": "Attitude", "D5": "Awareness", "D6": "Activism", "D7": "Emoceans", "D8": "Experience", "D9": "Adaptive Capacity", "D10": "Trust & Transparency"}};
const LABS=['INTENDED','IMPLIED','OBSERVED','REPORTED'];
const DEF={INTENDED:'An aim stated in the authors’ own words, referring to the artifact.',
  IMPLIED:'Follows from the artifact’s design choices, but is not stated as an aim.',
  OBSERVED:'Seen by the researchers (e.g. field notes, behaviour, logs), including accounts by third parties such as teachers or parents.',
  REPORTED:'Expressed by participants (e.g. interviews, quotes, questionnaires, scales, knowledge tests).'};
const FAMW={P:'Principle',Pe:'Perspective',D:'Dimension'};
const famOf=c=>c.startsWith('Pe')?'Pe':c[0];
const ORDER=[...Array(7)].map((_,i)=>'P'+(i+1)).concat([...Array(7)].map((_,i)=>'Pe'+(i+1)),[...Array(10)].map((_,i)=>'D'+(i+1)));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st={show:{HCI:true,'non-HCI':true},cas:null,sel:null,tab:'syn'};
const ns='http://www.w3.org/2000/svg', dotsG=document.getElementById('dots'), haloG=document.getElementById('halo');
const R=10;

const visible=c=>st.show[c.type];
function dotsFor(){ // [{code,case,lab}]
  const list=st.cas!==null?[D.cases[st.cas]]:D.cases.filter(visible);
  const out={};
  list.forEach(c=>ORDER.forEach(code=>(c.codes[code]||[]).forEach(lab=>(out[code]=out[code]||[]).push({code,ci:D.cases.indexOf(c),lab}))));
  return out;
}
function place(code,n){
  const s=D.slots[code], sp=R*1.75, per=Math.max(3,Math.min(8,Math.floor((2*s.half+sp)/sp)));
  const d0=s.ext+R+9, pts=[];
  for(let k=0;k<n;k++){
    const row=Math.floor(k/per), inRow=Math.min(per,n-row*per), j=k-row*per;
    const a=(j-(inRow-1)/2)*sp + (row%2?sp/2:0)*(inRow<per?0:1), b=d0+row*sp*.88;
    pts.push([s.c[0]+s.t[0]*a+s.n[0]*b, s.c[1]+s.t[1]*a+s.n[1]*b]);
  }
  return pts;
}
function drawCompass(){
  const by=dotsFor(); dotsG.replaceChildren(); haloG.replaceChildren();
  document.querySelectorAll('.lbl').forEach(g=>g.classList.toggle('on',!!by[g.dataset.code]));
  const solid=st.cas!==null;
  Object.entries(by).forEach(([code,arr])=>{
    const F=D.slots[code].fill, pos=(!solid&&arr.length<=F.length)?F.slice(0,arr.length):place(code,arr.length);
    pos.forEach(([x,y],k)=>{
      const d=arr[k], c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));c.setAttribute('r',R);
      c.setAttribute('fill',`var(--${d.lab})`);c.setAttribute('class','dot');
      c.style.opacity=solid?1:.3;
      c.setAttribute('tabindex','0');c.setAttribute('role','button');
      c.setAttribute('aria-label',`${D.cases[d.ci].name}: ${D.names[code]}, ${d.lab.toLowerCase()}`);
      const go=()=>openCase(d.ci,{code,lab:d.lab});
      c.addEventListener('click',go);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
      dotsG.appendChild(c);
      if(solid&&st.sel&&st.sel.code===code&&st.sel.lab===d.lab){
        const h=document.createElementNS(ns,'circle');
        h.setAttribute('cx',x.toFixed(1));h.setAttribute('cy',y.toFixed(1));h.setAttribute('r',R+8);
        h.setAttribute('fill',`var(--${d.lab})`);h.style.opacity=.28;haloG.appendChild(h);
      }
    });
  });
}
function titleHTML(){
  const h=st.show.HCI, n=st.show['non-HCI'];
  if(h&&n) return 'How <b>HCI and non-HCI</b> <i>literature contribute to Ocean Literacy.</i>';
  return `How <b>${h?'HCI':'non-HCI'} literature</b> <i>contributes to Ocean Literacy.</i>`;
}
function ordered(){
  const types=st.show.HCI?['HCI','non-HCI']:['non-HCI','HCI'];
  return types.flatMap(t=>D.cases.map((c,i)=>({c,i})).filter(x=>x.c.type===t));
}
function caseBtn(i,cls=''){const c=D.cases[i];
  return `<button class="case ${cls}" data-ci="${i}" ${cls.includes('off')?'aria-disabled="true"':''}>${cls.includes('nochev')?'':'<span class="chev" aria-hidden="true"></span>'}<span class="ct">${esc(c.name)}</span></button>`;}
function renderList(){
  document.getElementById('right').innerHTML=`<h1>${titleHTML()}</h1>
    <ul class="list">${ordered().map(({c,i})=>`<li>${caseBtn(i,visible(c)?'':'off')}</li>`).join('')}</ul>`;
}
function article(l){return /^[AEIOU]/.test(l)?'an':'a';}
function renderCase(){
  const c=D.cases[st.cas], s=st.sel;
  let box='';
  if(s){
    const fam=famOf(s.code), lc=`var(--${s.lab})`;
    const items=(c.ex[s.code]||[]).filter(x=>x.lab===s.lab);
    const syn=c.syn[s.code]||'';
    const body=st.tab==='syn'
      ? (syn&&syn!=='<to be written>'?`<p class="syn">${esc(syn)}</p>`:`<p class="syn tbw">${esc('<to be written>')}</p>`)
      : `<ul class="exl">${items.map(x=>`<li><q>${esc(x.q)}</q><small>${esc(x.sec)}</small></li>`).join('')}</ul>`;
    box=`<div class="box" style="--lc:${lc};--tint:color-mix(in srgb,${lc} 30%,#fff);--fam:var(--f${fam})">
      <div class="bin"><p class="bt">Why ${esc(D.names[s.code].toUpperCase())} is ${article(s.lab)} <em>${s.lab.toLowerCase()}</em> ${FAMW[fam]}</p>
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="syn" aria-selected="${st.tab==='syn'}">SYNTHESIS</button><button class="tab" role="tab" data-tab="ex" aria-selected="${st.tab==='ex'}">EXCERPT</button></div>
      ${body}</div><div class="bar"></div></div>`;
  }
  const others=t=>D.cases.map((x,i)=>({x,i})).filter(o=>o.i!==st.cas&&o.x.type===t&&visible(o.x));
  const other=c.type==='HCI'?'non-HCI':'HCI';
  const col=a=>a.length?`<ul>${a.map(o=>`<li>${caseBtn(o.i,'nochev')}</li>`).join('')}</ul>`:'';
  document.getElementById('right').innerHTML=`<button class="small" id="back" title="Back to all cases"><h1>${titleHTML()}</h1></button>
    <article class="view"><h2>${esc(c.name)}</h2><p class="desc">${esc(c.desc)}</p>
    <ul class="papers">${c.papers.map(p=>`<li>${esc(p.title)} | <a href="${esc(p.doi)}" target="_blank" rel="noopener">DOI</a></li>`).join('')}</ul>
    ${box}<nav class="others" aria-label="Other cases">${col(others(other))}${col(others(c.type))}</nav></article>`;
  document.getElementById('back').onclick=()=>{st.cas=null;st.sel=null;render();};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;renderCase();});
}
function openCase(i,sel){
  st.cas=i;
  if(!sel){const c=D.cases[i],code=ORDER.find(k=>c.codes[k]);sel={code,lab:c.codes[code][0]};}
  st.sel=sel; render();
}
function render(){
  if(st.cas!==null&&!visible(D.cases[st.cas])){st.cas=null;st.sel=null;}
  drawCompass(); st.cas===null?renderList():renderCase();
  document.querySelectorAll('#right .case').forEach(b=>{if(!b.classList.contains('off'))b.onclick=()=>openCase(+b.dataset.ci);});
}
function toggle(t,btn){
  const other=t==='HCI'?'non-HCI':'HCI';
  if(st.show[t]&&!st.show[other]) st.show[other]=true;  // keep at least one on
  st.show[t]=!st.show[t];
  document.getElementById('tgH').setAttribute('aria-pressed',st.show.HCI);
  document.getElementById('tgN').setAttribute('aria-pressed',st.show['non-HCI']);
  render();
}
document.getElementById('tgH').onclick=e=>toggle('HCI',e.currentTarget);
document.getElementById('tgN').onclick=e=>toggle('non-HCI',e.currentTarget);
// legend definitions
let tip=null;
const closeTip=()=>{if(tip){tip.remove();tip=null;}};
document.querySelectorAll('.info').forEach(b=>b.onclick=e=>{
  e.stopPropagation(); const open=tip&&tip.dataset.k===b.dataset.k; closeTip(); if(open) return;
  tip=document.createElement('div');tip.className='tip';tip.dataset.k=b.dataset.k;tip.setAttribute('role','tooltip');
  tip.innerHTML=`<b>${b.dataset.k}</b>${esc(DEF[b.dataset.k])}`; b.parentElement.appendChild(tip);
});
document.addEventListener('click',closeTip);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return; if(tip){closeTip();return;} if(st.cas!==null){st.cas=null;st.sel=null;render();}});
render();
}
</script>
</body></html>
